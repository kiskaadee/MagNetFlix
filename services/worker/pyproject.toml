[project]
name = "magnetflix-worker"
version = "0.1.0"
description = "gRPC Pipeline Worker and Transmission coordinator for MagNetFlix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20.0",
  "alembic>=1.14.0",
  "cinemagoer>=2023.5.1",
  "grpcio>=1.83.1",
  "protobuf>=7.36.1",
  "pydantic>=2.10.0",
  "sqlalchemy>=2.0.36",
  "transmission-rpc>=7.0.11",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
