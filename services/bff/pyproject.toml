[project]
name = "magnetflix-bff"
version = "0.1.0"
description = "FastAPI Backend-for-Frontend and Web Gateway for MagNetFlix"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115.0",
  "grpcio>=1.83.1",
  "jinja2>=3.1.4",
  "protobuf>=7.36.1",
  "pydantic>=2.10.0",
  "uvicorn[standard]>=0.32.0",
]

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"
